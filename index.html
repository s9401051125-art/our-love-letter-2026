寶寶～今天是我們在一起滿一週年的日子耶！💗

時間真的過得好快好快，怎麼感覺才剛在一起沒多久，一轉眼就已經牽著彼此的手走過一整年了！

可能是因為這一年有你陪在我身邊，每一天都過得好幸福，所以才覺得時間偷偷溜走得特別快吧！

可是仔細回想起來，我們真的一起創造了好多好多回憶，去了好多地方，吃了好多好吃的，你的車技也越來越厲害了 ദി- ̫ -)♡

每次回想起我們剛在一起的時候，心裡還是會甜甜的，覺得那時候的我們好可愛、好幸福。沒想到當初那個讓我心動的人，現在已經是陪在我身邊一整年的寶寶了！

雖然今年暑假的那三個月過得特別特別快，我們都忙著工作，沒有太多時間可以出去玩，但你還是會用那些平凡又可愛的小方式偷偷疼愛我，讓我覺得自己一直都是被你好好捧在手心裡的小寶貝 ♡

雖然我常常會故意跟你說「你是不是不愛我了！」但還不是因為平常的你真的太疼我了嘛！害我都被你寵壞了，才會忍不住想要你再多愛我一點點(˶ˊᵕˋ˵)

比起那些東西，我更希望我的寶寶可以不要有那麼大的壓力，可以每天都開開心心、輕輕鬆鬆的。

雖然現在的我可能還沒有辦法幫你分擔太多經濟上的壓力，但是！我的心可是一直一直跟你站在同一邊的喔！你累的時候可以跟我撒嬌，煩的時候可以跟我抱怨，不開心的時候也可以通通告訴我，雖然我不一定能幫你解決所有事情，但我一定會當你最忠實的小聽眾哈哈哈 ♡

而且我覺得今年的寶寶真的很棒很棒！

你勇敢地跳出了待了十年的舒適圈，開始接觸不一樣的工作和生活。我知道這個決定一點都不容易，也知道這一路上你一定有很多壓力和不安。

可是看見現在的你，工作心情還算不錯，也能早早回家，有更多時間可以休息、陪陪我，我真的替你感到好開心！

希望你也要記得，你已經很努力、很棒了，不用什麼事情都自己扛著，也不用總是逼自己那麼辛苦。因為我最希望的，就是我的寶寶可以健健康康、快快樂樂的 ♡

今年我們一起走過了台灣好多縣市，還一起飛去日本玩耶！每次想到那些回憶都覺得好幸福。

希望我們的第二年、第三年，還有以後好多好多年，都可以繼續牽著手到處走走看看！當然啦～第二年也要努力安排一次出國旅行喔！這是我偷偷許下的願望 ദി ˉ͈̀꒳ˉ͈́ )✧

我真的真的好喜歡跟你一起出門。

其實去哪裡都沒有那麼重要，重要的是旁邊的人是你。只要跟你待在一起，就算只是吃個飯、逛逛街，或是做一些很平凡的小事情，我都覺得好幸福。

因為跟你出門、跟你待在一起，就是我最喜歡的充電方式。只要有你陪著，好像一整個禮拜的疲憊都可以被充得滿滿的！

雖然我們偶爾也會鬥嘴、吵吵架，有時候還會互相鬧脾氣，但回頭想想，還是覺得我們好甜好可愛喔哈哈哈。

而且我很喜歡我們兩個總是有說不完的話，生活裡發生什麼大事小事，都會想第一時間分享給對方。明明每天都在聊天，卻還是有好多好多事情想跟你說。

我想，這就是我最喜歡我們的地方吧！不只是情侶，也是彼此最親密、最有默契的好朋友 ♡

其實還有好多好多想跟你說的話，但我們平常好像就已經把愛你、想你、喜歡你通通掛在嘴邊了，所以最後還是想好好謝謝你。

謝謝你這一年來給我的滿滿偏愛，謝謝你總是把我的小願望放在心上，也謝謝你一直用你的方式好好愛著我。

就連我想要一件這麼貴的被被，你也默默幫我安排上了！真的很喜歡這份禮物💝

但其實比起收到被子，更讓我開心的是，你總是記得我隨口說過的喜歡，也願意把我的小小願望當成重要的事情。

那種被你惦記著、被你放在心上的感覺，真的好幸福好幸福。

希望未來的日子裡，我也可以成為讓你覺得幸福、安心又快樂的存在。

希望我們可以繼續一起吃好多好吃的、去好多沒去過的地方、拍好多好多照片，累積更多只屬於我們兩個的小回憶。

也希望不管過了幾年，我們都還是會像現在一樣，喜歡黏著彼此、跟對方分享生活，偶爾幼稚地撒撒嬌，然後一直一直把對方放在心上。

第一年是你，第二年也要是你，以後的每一年，我都還想繼續當你最最幸福的小寶貝 ♡

我愛你喔，我最親愛的寶寶！

一週年快樂！以後也請你繼續多多疼愛你的小寶貝啦！ 💗

♡ 365天的喜歡，還有好多好多天的愛你 ♡`;
